<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="100%" height="100%">
  <defs>
    <!-- Primary Brand Gradients -->
    <linearGradient id="emeraldRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#027a48" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="tealPetroleum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#0e4e5b" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ==================== EMBLEM (X: 10 to 220, Y: 15 to 165) ==================== -->
  <g id="emblem" transform="translate(10, 5)">
    <!-- 1. CITIZEN GROUP (Left) -->
    <!-- Head 1 (Left) -->
    <circle cx="45" cy="52" r="9" fill="#0e4e5b" />
    <!-- Head 2 (Center Top) -->
    <circle cx="70" cy="38" r="10.5" fill="#0e4e5b" />
    <!-- Head 3 (Inner Bottom) -->
    <circle cx="70" cy="74" r="8" fill="#0e4e5b" />

    <!-- Embracing Citizen Body Curves -->
    <path d="M26 68 C 38 68, 48 76, 56 86 C 50 94, 42 100, 32 102 C 24 92, 22 80, 26 68 Z" fill="#0e4e5b" />
    <path d="M48 90 C 58 78, 70 70, 86 68 C 84 76, 82 85, 78 94 C 68 94, 58 92, 48 90 Z" fill="#0e4e5b" />
    <path d="M44 94 C 54 104, 62 116, 64 130 C 52 126, 44 118, 40 108 C 41 103, 42 98, 44 94 Z" fill="#0e4e5b" />

    <!-- 2. CITY SKYLINE / INFRASTRUCTURE BUILDINGS (Center) -->
    <!-- Building 1 (Tall center-left tower) -->
    <rect x="100" y="28" width="24" height="98" rx="2" fill="#083344" />
    <!-- Building 1 Roof Angle -->
    <polygon points="100,28 124,18 124,28" fill="#083344" />
    <!-- Windows Building 1 -->
    <rect x="105" y="36" width="5" height="7" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="113" y="36" width="5" height="7" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="105" y="50" width="5" height="7" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="113" y="50" width="5" height="7" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="105" y="64" width="5" height="7" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="113" y="64" width="5" height="7" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="105" y="78" width="5" height="7" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="113" y="78" width="5" height="7" rx="1" fill="#ffffff" opacity="0.9" />

    <!-- Building 2 (Left Lower Tower) -->
    <rect x="88" y="56" width="12" height="66" rx="2" fill="#0e4e5b" />
    <rect x="91" y="66" width="4" height="6" rx="1" fill="#ffffff" opacity="0.8" />
    <rect x="91" y="78" width="4" height="6" rx="1" fill="#ffffff" opacity="0.8" />

    <!-- Building 3 (Right Stepped Tower) -->
    <rect x="124" y="44" width="16" height="82" rx="2" fill="#083344" />
    <rect x="128" y="54" width="4" height="6" rx="1" fill="#ffffff" opacity="0.8" />
    <rect x="134" y="54" width="4" height="6" rx="1" fill="#ffffff" opacity="0.8" />
    <rect x="128" y="68" width="4" height="6" rx="1" fill="#ffffff" opacity="0.8" />
    <rect x="134" y="68" width="4" height="6" rx="1" fill="#ffffff" opacity="0.8" />

    <!-- 3. NEURAL NETWORK NODES & CONNECTIONS (Right) -->
    <!-- Connection lines -->
    <line x1="138" y1="84" x2="165" y2="60" stroke="#0e4e5b" stroke-width="4.5" stroke-linecap="round" />
    <line x1="165" y1="60" x2="190" y2="88" stroke="#0e4e5b" stroke-width="4.5" stroke-linecap="round" />
    <line x1="165" y1="60" x2="182" y2="40" stroke="#0e4e5b" stroke-width="4" stroke-linecap="round" />
    <line x1="138" y1="84" x2="158" y2="108" stroke="#0e4e5b" stroke-width="4" stroke-linecap="round" />
    <line x1="158" y1="108" x2="190" y2="88" stroke="#0e4e5b" stroke-width="4.5" stroke-linecap="round" />

    <!-- Network Nodes -->
    <circle cx="165" cy="60" r="7.5" fill="#0e4e5b" />
    <circle cx="190" cy="88" r="8.5" fill="#059669" />
    <circle cx="182" cy="40" r="6" fill="#059669" />
    <circle cx="158" cy="108" r="7" fill="#0e4e5b" />

    <!-- 4. DYNAMIC CONNECTIVE EMERALD RIBBON / SWOOSH -->
    <!-- Flows beneath people, arcs up into buildings, and swoops up to network node -->
    <path d="M 22 76 
             C 42 78, 60 92, 74 116
             C 84 134, 102 142, 118 134
             C 132 126, 142 108, 150 92
             C 160 120, 172 136, 186 128
             C 196 120, 198 102, 192 92
             C 186 82, 172 104, 164 110
             C 152 118, 142 110, 134 94
             C 126 78, 116 70, 104 74
             C 92 78, 82 96, 72 108
             C 62 122, 48 116, 40 102
             C 32 88, 26 80, 22 76 Z" 
          fill="url(#emeraldRibbon)" 
          filter="url(#subtleGlow)" />
  </g>

  <!-- ==================== TYPOGRAPHY (X: 235 to 600, Y: 110) ==================== -->
  <g id="wordmark" transform="translate(235, 114)">
    <!-- RAABTA in bold petroleum navy -->
    <text x="0" y="0" 
          font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="68" 
          letter-spacing="2" 
          fill="#083344">
      RAABTA
    </text>

    <!-- AI in vibrant emerald teal -->
    <text x="325" y="0" 
          font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="68" 
          letter-spacing="1" 
          fill="#059669">
      AI
    </text>
  </g>
</svg>
